{% extends "base.html" %}
{% block content %}
<div style="max-width: 700px; margin: 40px auto; padding: 0 20px;">
    
    <div style="margin-bottom: 24px;">
        <a href="{% url 'forum_list' %}" style="color: #059669; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
            <i class="bi bi-arrow-left"></i> Back to Community
        </a>
    </div>

    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee;">
        <h2 style="font-size: 28px; color: #111; margin-bottom: 8px;">Ask the Community</h2>
        <p style="color: #666; margin-bottom: 32px;">Describe your farming issue clearly so other farmers and experts can help you.</p>

        <form method="POST">
            {% csrf_token %}
            
            <!-- Title -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 8px;">Question Title</label>
                <input type="text" name="title" required placeholder="e.g., Why are my tomato leaves turning yellow?" 
                       style="width: 100%; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; font-family: inherit;">
            </div>

            <!-- Content -->
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 8px;">Detailed Description</label>
                <textarea name="content" required rows="6" placeholder="Describe the symptoms, how long it has been happening, and any treatments you've already tried..." 
                          style="width: 100%; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <!-- Buttons -->
            <div style="display: flex; gap: 12px;">
                <a href="{% url 'forum_list' %}" style="flex: 1; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; color: #555; background: #F3F4F6; border: 1px solid #E5E7EB;">Cancel</a>
                <button type="submit" style="flex: 2; background: #059669; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer;">
                    Post Question
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
