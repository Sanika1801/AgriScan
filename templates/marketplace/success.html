{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 80px auto; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;">
    
    <div style="font-size: 64px; margin-bottom: 16px;">🎉</div>
    <h1 style="color: #059669; margin-bottom: 8px;">Payment Successful!</h1>
    <p style="color: #666; margin-bottom: 32px;">Your order has been placed successfully.</p>

    <div style="background: #F3F4F6; padding: 20px; border-radius: 12px; margin-bottom: 32px; text-align: left;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: #666;">Order ID:</span>
            <strong>#ORD-{{ order.id }}</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: #666;">Amount Paid:</span>
            <strong>₹{{ order.total_amount }}</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
            <span style="color: #666;">Status:</span>
            <strong style="color: #D97706;">{{ order.status|title }}</strong>
        </div>
    </div>

    <div style="display: flex; gap: 12px;">
        <a href="{% url 'store' %}" style="flex: 1; background: #F3F4F6; color: #111; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: 600;">Continue Shopping</a>
        <a href="{% url 'home' %}" style="flex: 1; background: #059669; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: 600;">Go to Dashboard</a>
    </div>

</div>
{% endblock %}
